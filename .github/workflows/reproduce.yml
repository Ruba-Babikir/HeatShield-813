name: Reproduce notebook
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  notebook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check anonymous repository access
        run: >-
          curl -q --fail --silent --show-error --location --max-time 30
          --output /dev/null --write-out "Anonymous repository HTTP status: %{http_code}\n"
          https://github.com/${{ github.repository }}
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install exact direct dependencies
        run: python -m pip install -r requirements.txt
      - name: Run all cells in a fresh Jupyter kernel
        run: >-
          jupyter nbconvert --to notebook --execute
          notebooks/02_main_analysis.ipynb
          --output-dir=executed-notebooks
          --ExecutePreprocessor.timeout=600
      - name: Check submission files and notebook errors
        run: python scripts/check_submission.py
      - uses: actions/upload-artifact@v4
        with:
          name: executed-notebook-and-results
          path: |
            executed-notebooks/
            results/
